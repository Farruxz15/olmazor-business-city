function applyTheme(){document.documentElement.dataset.theme=theme;$('#theme').innerHTML=(theme==='night'?'☀':'☾')+` <span class="theme-label">${t(theme==='night'?'day':'night')}</span>`;$('#theme').ariaLabel=t(theme==='night'?'day':'night');$('#theme').title=$('#theme').ariaLabel}
function render(keepScroll=false){const scroll=window.scrollY;document.documentElement.lang=lang;$('#language').value=lang;const id=location.hash.split('/')[1],index=P.findIndex(p=>p.id===id);$('#nav').innerHTML=`<a href="#map">${t('map')}</a>`+P.map((p,i)=>`<a class="${i===index?'active':''}" href="${projectLink(i)}">${name(p)}</a>`).join('');$('#nav').ariaLabel=t('projects');$('#app').innerHTML=index>=0?renderProject(index):renderHome();$('#footer').innerHTML=`<span>OLMAZOR BUSINESS CITY</span><span>${t('sourceNote')}</span>`;document.title=(index>=0?name(P[index]):t('portfolio'))+' | Olmazor Business City';applyTheme();$('#close').textContent=t('close');$('#zoom').textContent=t('zoom');$('#prev').ariaLabel=t('previousPage');$('#next').ariaLabel=t('nextPage');$('#park-close').ariaLabel=t('close');if(keepScroll)window.scrollTo(0,scroll);else if(index>=0||!location.hash||location.hash==='#home')window.scrollTo(0,0);else requestAnimationFrame(()=>{const target=document.getElementById(location.hash.slice(1));if(target)target.scrollIntoView()});}
$('#language').onchange=e=>{lang=e.target.value;save('obc-language',lang);render(true)};$('#theme').onclick=()=>{theme=theme==='night'?'day':'night';save('obc-theme',theme);applyTheme()};window.addEventListener('hashchange',()=>render());
function showPage(){const n=currentPages[pageIndex];$('#viewer-title').textContent=t('page')+' '+n+' / 24';$('#viewer-image').innerHTML=`<img src="${A.pages[n-1]}" alt="${t('page')} ${n}">`;$('#viewer-image').classList.remove('zoom');$('#zoom').textContent=t('zoom');$('#prev').disabled=pageIndex===0;$('#next').disabled=pageIndex===currentPages.length-1;}
document.addEventListener('click',e=>{const sheetBtn=e.target.closest('[data-page]');if(sheetBtn){const i=P.findIndex(p=>p.id===location.hash.split('/')[1]);currentPages=i>=0?P[i].pages:[1,2];pageIndex=currentPages.indexOf(+sheetBtn.dataset.page);showPage();$('#viewer').showModal()}const parkBtn=e.target.closest('[data-park]');if(parkBtn){$('#park-content').innerHTML=`<div class="eyebrow">${t('map')}</div><h2>${t(parkBtn.dataset.park)}</h2>${parkBtn.dataset.park==='qodiriy'?`<p>${t('mapArea')}: ${area(23.3)}</p>`:''}<p>${t('parkNote')}</p>`;$('#park').showModal()}});
$('#prev').onclick=()=>{if(pageIndex>0){pageIndex--;showPage()}};$('#next').onclick=()=>{if(pageIndex<currentPages.length-1){pageIndex++;showPage()}};$('#zoom').onclick=()=>{const zoom=$('#viewer-image').classList.toggle('zoom');$('#zoom').textContent=t(zoom?'fit':'zoom')};$('#close').onclick=()=>$('#viewer').close();$('#park-close').onclick=()=>$('#park').close();$('#viewer').addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('#prev').click();if(e.key==='ArrowRight')$('#next').click()});for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d)d.close()});render();
// Soft architectural light trail. No cursor replacement; disabled for reduced motion.
const canvas=$('#trail'),ctx=canvas.getContext('2d');let dots=[],running=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)'),fine=matchMedia('(pointer: fine)');function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0)}resize();addEventListener('resize',resize);addEventListener('pointermove',e=>{if(reduced.matches||!fine.matches||e.pointerType==='touch')return;dots.push({x:e.clientX,y:e.clientY,time:performance.now()});if(dots.length>45)dots.shift();if(!running){running=true;requestAnimationFrame(drawTrail)}});function drawTrail(now){ctx.clearRect(0,0,innerWidth,innerHeight);dots=dots.filter(p=>now-p.time<650);dots.forEach((p,i)=>{const fade=1-(now-p.time)/650;const rgb=theme==='night'?'134,220,243':'0,115,155';ctx.beginPath();ctx.strokeStyle=`rgba(${rgb},${fade*.27})`;ctx.lineWidth=1;ctx.arc(p.x,p.y,3+(1-fade)*13,0,Math.PI*2);ctx.stroke();if(i){ctx.beginPath();ctx.strokeStyle=`rgba(${rgb},${fade*.4})`;ctx.moveTo(dots[i-1].x,dots[i-1].y);ctx.lineTo(p.x,p.y);ctx.stroke()}});if(dots.length)requestAnimationFrame(drawTrail);else running=false;}
